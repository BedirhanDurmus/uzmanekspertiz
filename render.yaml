# Render Blueprint — https://render.com/docs/blueprint-spec
# Flask: web_app.py içindeki `app` nesnesi
#
# Arabam CSV repoda yoksa: Dashboard → Environment → ARABAM_CSV_URL
# (dosyanin dogrudan indirme URL'i; ilk istekte data/ altina iner)

services:
  - type: web
    name: arabam-flask
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /
